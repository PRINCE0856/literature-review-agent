[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-review-agent"
version = "1.0.0"
description = "Claude Code multi-agent system for legal, verifiable, resumable literature reviews."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Literature Review Agent contributors" }]
keywords = ["literature-review", "systematic-review", "openalex", "crossref", "claude-code"]

dependencies = [
    "httpx>=0.27,<1.0",
    "tenacity>=8.2",
    "pydantic>=2.6,<3.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "rapidfuzz>=3.6",
    "python-docx>=1.1",
    "PyMuPDF>=1.24",
    "pypdf>=4.0",
    "bibtexparser>=1.4,<2.0",
    "rispy>=0.9",
    "typer>=0.12",
    "rich>=13.7",
    "nbformat>=5.9",
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "respx>=0.21"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0"]

[project.scripts]
literature-review-agent = "literature_review_agent.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
literature_review_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "live: optional tests that require real internet access (deselect with '-m \"not live\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
